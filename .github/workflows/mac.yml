 name: Build & Release Input23DS macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH=$Qt6_DIR

      - name: Build
        run: cmake --build build --config Release

      - name: Locate .app
        run: find build -name "*.app"

      - name: Zip .app
        run: |
          cd build
          zip -r Input23DS-macOS.zip *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Input23DS-macOS
          path: build/Input23DS-macOS.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Input23DS-macOS.zip
