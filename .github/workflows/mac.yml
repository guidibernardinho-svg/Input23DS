name: Build Input23DS macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          cache: true

      - name: Show Qt path (debug)
        run: |
          echo "Qt path:"
          echo $Qt6_DIR
          ls $Qt6_DIR

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH=$Qt6_DIR

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Find app
        run: |
          find build -name "*.app" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Input23DS-macOS
          path: build
